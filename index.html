<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Drive Inventory Tracker</title>
    <!-- Tailwind CSS for clean framing context styling -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">

    <!-- Header Frame -->
    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold tracking-tight">Tech Drive Workbench</h1>
                <p class="text-blue-100 text-xs mt-0.5">Interactive Spreadsheet Grid Dashboard Viewer</p>
            </div>
            <div class="text-xs bg-white/10 px-3 py-1.5 rounded-full border border-white/20 backdrop-blur-xs">
                🟢 Direct live link connection active
            </div>
        </div>
    </header>

    <!-- Navigation Tab Layout -->
    <div class="max-w-7xl mx-auto px-4 mt-6">
        <div class="flex border-b border-gray-200 bg-white rounded-t-lg shadow-xs overflow-hidden">
            <button id="tab-donations" onclick="switchView('donations')" class="flex-1 py-3 px-6 text-center font-medium border-b-2 border-blue-600 text-blue-600 bg-gray-50/50 cursor-pointer focus:outline-hidden">
                📋 Donations Grid Tracker
            </button>
            <button id="tab-repairs" onclick="switchView('repairs')" class="flex-1 py-3 px-6 text-center font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-50/50 cursor-pointer focus:outline-hidden">
                🛠️ Repairs Workbench Grid
            </button>
        </div>
    </div>

    <!-- Live Excel Clone Embedded Viewing Frames -->
    <main class="max-w-7xl mx-auto px-4 mb-12">
        <div class="bg-white rounded-b-lg shadow-md border-x border-b border-gray-200 overflow-hidden">
            
            <!-- Donations Sheet Embedded Frame Container -->
            <div id="frame-donations" class="w-full h-[75vh]">
                <iframe 
                    src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRdTZiFaDCSnV4D7_C1OvYZQuhM89ZTPOZ5OkEAg770NbBGa7F7Vl17ZkDjr6gUOlw97WwiquUaK5o2/pub?gid=1591322061&single=true&output=csv" 
                    class="w-full h-full border-0">
                </iframe>
            </div>

            <!-- Repairs Sheet Embedded Frame Container -->
            <div id="frame-repairs" class="w-full h-[75vh] hidden">
                <iframe 
                    src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRdTZiFaDCSnV4D7_C1OvYZQuhM89ZTPOZ5OkEAg770NbBGa7F7Vl17ZkDjr6gUOlw97WwiquUaK5o2/pub?gid=2051051474&single=true&output=csv" 
                    class="w-full h-full border-0">
                </iframe>
            </div>

        </div>
    </main>

    <script>
        function switchView(targetView) {
            var donBtn = document.getElementById("tab-donations");
            var repBtn = document.getElementById("tab-repairs");
            var donFrame = document.getElementById("frame-donations");
            var repFrame = document.getElementById("frame-repairs");

            if (targetView === "donations") {
                // Style Active Tab Action Styling
                donBtn.className = "flex-1 py-3 px-6 text-center font-medium border-b-2 border-blue-600 text-blue-600 bg-gray-50/50 cursor-pointer focus:outline-hidden";
                repBtn.className = "flex-1 py-3 px-6 text-center font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-50/50 cursor-pointer focus:outline-hidden";
                
                // Show Framework Frame Panel Selection Node Bounds
                donFrame.classList.remove("hidden");
                repFrame.classList.add("hidden");
            } else {
                // Style Active Tab Action Styling
                repBtn.className = "flex-1 py-3 px-6 text-center font-medium border-b-2 border-indigo-600 text-indigo-600 bg-gray-50/50 cursor-pointer focus:outline-hidden";
                donBtn.className = "flex-1 py-3 px-6 text-center font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-50/50 cursor-pointer focus:outline-hidden";
                
                // Show Framework Frame Panel Selection Node Bounds
                repFrame.classList.remove("hidden");
                donFrame.classList.add("hidden");
            }
        }
    </script>
</body>
</html>
