<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Drive Inventory Tracker</title>
    <!-- Load Tailwind CSS and the SheetJS Excel File Processing Engine -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        .excel-table th, .excel-table td {
            border: 1px solid #e2e8f0;
            padding: 10px 14px;
            font-size: 13px;
        }
        .excel-table th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            text-align: left;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased flex flex-col min-h-screen">

    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-sm shrink-0">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold tracking-tight">Tech Drive Tracker</h1>
                <p class="text-blue-100 text-xs mt-0.5">Live Interactive Spreadsheet Grid</p>
            </div>
            <div class="text-xs bg-white/10 px-3 py-1.5 rounded-full border border-white/20 backdrop-blur-xs">
                🟢 Live Excel Sync Active (Click rows to expand details)
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto w-full px-6 mt-6">
        <div class="flex border-b border-slate-200 bg-white rounded-t-xl shadow-xs overflow-hidden">
            <button id="tab-donations" onclick="switchTab(0)" class="flex-1 py-3.5 px-6 text-center font-semibold border-b-2 border-blue-600 text-blue-600 bg-slate-50/50 cursor-pointer focus:outline-hidden">
                📋 Donations Tracker
            </button>
            <button id="tab-repairs" onclick="switchTab(1)" class="flex-1 py-3.5 px-6 text-center font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 hover:bg-slate-50/50 cursor-pointer focus:outline-hidden">
                🛠️ Repairs Workbench
            </button>
        </div>
    </div>

    <main class="max-w-7xl mx-auto w-full px-6 mb-12 flex-grow">
        <div class="bg-white rounded-b-xl shadow-sm border-x border-b border-slate-200 p-6 min-h-[400px] relative">
            
            <div id="loading-overlay" class="absolute inset-0 bg-white/90 z-40 flex flex-col items-center justify-center transition-opacity duration-200">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mb-3"></div>
                <p class="text-slate-500 text-sm font-medium">Streaming live Excel workbook sheets...</p>
            </div>

            <div id="error-display" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm mb-4"></div>

            <div class="overflow-x-auto w-full">
                <table class="excel-table w-full border-collapse bg-white" id="data-table"></table>
            </div>

        </div>
    </main>
    <script>
        var XLSX_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRdTZiFaDCSnV4D7_C1OvYZQuhM89ZTPOZ5OkEAg770NbBGa7F7Vl17ZkDjr6gUOlw97WwiquUaK5o2/pub?output=xlsx";
        
        var workbookData = null;
        var currentSheetIndex = 0;

        function toggleGroup(id) {
            var targetRows = document.querySelectorAll(".group-" + id);
            var icon = document.getElementById("icon-" + id);
            targetRows.forEach(function(row) { row.classList.toggle("hidden"); });
            if (icon) { icon.innerText = icon.innerText === "＋" ? "－" : "＋"; }
        }

        function createCell(row, text, isHeader, colSpan) {
            var cell = document.createElement(isHeader ? "th" : "td");
            if (colSpan) cell.setAttribute("colspan", colSpan);
            cell.innerText = text || "";
            row.appendChild(cell);
            return cell;
        }

        function renderDonations(sheet) {
            var table = document.getElementById("data-table"); table.innerHTML = "";
            var rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            
            var headerTr = document.createElement("tr");
            headerTr.innerHTML = "<th></th><th>Tech Description</th><th>Donor Name</th><th>Lifecycle Status</th><th>Value Realized ($)</th><th>Image Attached</th>";
            table.appendChild(headerTr);

            var groupId = 0;
            for (var r = 1; r < rows.length; r++) {
                var rowData = rows[r]; if (!rowData || rowData.length === 0) continue;
                var desc = String(rowData[0] || "").trim();
                var donor = String(rowData[1] || "").trim();
                var status = String(rowData[2] || "").trim();
                var val = String(rowData[3] || "").trim();
                var img = String(rowData[4] || "").trim();

                if (!desc && !donor && !status) continue;
                var tr = document.createElement("tr");

                if (desc.indexOf("Images") !== -1 || desc.indexOf("Details") !== -1 || (!desc && img)) {
                    tr.className = "bg-slate-50/70 font-mono text-xs text-slate-500 group-" + groupId + " hidden";
                    createCell(tr, "");
                    var dCell = createCell(tr, desc || "Details:", false, "3");
                    dCell.className = "italic text-slate-600";
                    var lCell = document.createElement("td"); lCell.setAttribute("colspan", "2");
                    if (img && img.indexOf("http") === 0) {
                        lCell.innerHTML = "<a href='"+img+"' target='_blank' class='text-blue-600 underline font-semibold'>[View Asset Image Link]</a>";
                    } else { lCell.innerText = img || "No files uploaded"; }
                    tr.appendChild(lCell);
                } else {
                    groupId++; tr.className = "hover:bg-slate-50 cursor-pointer font-medium text-slate-900 border-t-2 border-slate-100";
                    tr.setAttribute("onclick", "toggleGroup(" + groupId + ")");
                    var c0 = createCell(tr, "＋", false); c0.className = "text-center font-bold text-blue-600 select-none w-10"; c0.id = "icon-" + groupId;
                    var c1 = createCell(tr, desc, false); c1.className = "font-semibold";
                    createCell(tr, donor, false);
                    var c3 = document.createElement("td");
                    var bColor = status.indexOf("Sold") !== -1 ? "bg-green-100 text-green-800" : status.indexOf("E-Waste") !== -1 ? "bg-red-100 text-red-800" : "bg-amber-100 text-amber-800";
                    c3.innerHTML = "<span class='px-2.5 py-0.5 text-xs font-semibold rounded-full " + bColor + "'>" + status + "</span>";
                    tr.appendChild(c3);
                    createCell(tr, val, false);
                    createCell(tr, img ? "🔗 Available" : "", false);
                }
                table.appendChild(tr);
            }
        }

        function renderRepairs(sheet) {
            var table = document.getElementById("data-table"); table.innerHTML = "";
            var rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            
            var headerTr = document.createElement("tr");
            headerTr.innerHTML = "<th></th><th>Tech Item</th><th>Client Name</th><th>Issue Description</th><th>Repair Status</th><th>Earned</th><th>Profit</th>";
            table.appendChild(headerTr);

            var groupId = 0;
            for (var r = 1; r < rows.length; r++) {
                var rowData = rows[r]; if (!rowData || rowData.length === 0) continue;
                var item = String(rowData[0] || "").trim();
                var client = String(rowData[1] || "").trim();
                var issue = String(rowData[2] || "").trim();
                var status = String(rowData[3] || "").trim();
                var earned = String(rowData[4] || "").trim();
                var profit = String(rowData[5] || "").trim();

                if (item.indexOf("Paid Repairs") !== -1 || item.indexOf("Tech Item") !== -1) continue;
                if (!item && !client && !issue) continue;
                var tr = document.createElement("tr");

                if (item.indexOf("Repair Details") !== -1 || item.indexOf("Images") !== -1 || (!client && !issue)) {
                    tr.className = "bg-amber-50/20 text-xs text-slate-600 group-" + groupId + " hidden";
                    createCell(tr, "");
                    var dCell = createCell(tr, item, false, "3");
                    dCell.className = "whitespace-pre-wrap p-4 bg-slate-50 rounded-lg border border-slate-100 leading-relaxed font-mono";
                    var lCell = createCell(tr, "No images uploaded", false, "3"); lCell.className = "text-slate-400 italic";
                    if (rowData[7] && String(rowData[7]).indexOf("http") === 0) {
                        lCell.className = ""; lCell.innerHTML = "<a href='"+rowData[7]+"' target='_blank' class='text-indigo-600 underline font-semibold'>[Attached Fix Photo]</a>";
                    }
                } else {
                    groupId++; tr.className = "hover:bg-slate-50 cursor-pointer font-medium text-slate-900 border-t-2 border-slate-100";
                    tr.setAttribute("onclick", "toggleGroup(" + groupId + ")");
                    var c0 = createCell(tr, "＋", false); c0.className = "text-center font-bold text-indigo-600 select-none w-10"; c0.id = "icon-" + groupId;
                    var c1 = createCell(tr, item, false); c1.className = "font-semibold";
                    createCell(tr, client, false);
                    var c3 = createCell(tr, issue, false); c3.className = "max-w-xs truncate text-slate-500"; c3.title = issue;
                    var c4 = document.createElement("td");
                    var bColor = status.indexOf("Fixed") !== -1 ? "bg-green-100 text-green-800" : "bg-amber-100 text-amber-800";
                    c4.innerHTML = "<span class='px-2.5 py-0.5 text-xs font-semibold rounded-full " + bColor + "'>" + status + "</span>";
                    tr.appendChild(c4);
                    createCell(tr, earned, false);
                    createCell(tr, profit, false);
                }
                table.appendChild(tr);
            }
        }

        async function initExcelEngine() {
            var overlay = document.getElementById("loading-overlay");
            var errorBanner = document.getElementById("error-display");
            try {
                var res = await fetch(XLSX_URL + "&cb=" + new Date().getTime());
                if (!res.ok) throw new Error("Google spreadsheet feed connection failed");
                var arrayBuffer = await res.arrayBuffer();
                var data = new Uint8Array(arrayBuffer);
                workbookData = XLSX.read(data, { type: "array" });
                
                switchTab(currentSheetIndex);
                overlay.classList.add("hidden");
            } catch (err) {
                overlay.classList.add("hidden");
                errorBanner.innerText = "Excel Engine Loader Error: " + err.message;
                errorBanner.classList.remove("hidden");
            }
        }

        function switchTab(index) {
            currentSheetIndex = index;
            var donBtn = document.getElementById("tab-donations");
            var repBtn = document.getElementById("tab-repairs");
            
            if (index === 0) {
                donBtn.className = "flex-1 py-3.5 px-6 text-center font-semibold border-b-2 border-blue-600 text-blue-600 bg-slate-50/50 cursor-pointer focus:outline-hidden";
                repBtn.className = "flex-1 py-3.5 px-6 text-center font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 hover:bg-slate-50/50 cursor-pointer focus:outline-hidden";
                if (workbookData) renderDonations(workbookData.Sheets[workbookData.SheetNames[0]]);
            } else {
                repBtn.className = "flex-1 py-3.5 px-6 text-center font-semibold border-b-2 border-indigo-600 text-indigo-600 bg-slate-50/50 cursor-pointer focus:outline-hidden";
                donBtn.className = "flex-1 py-3.5 px-6 text-center font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 hover:bg-slate-50/50 cursor-pointer focus:outline-hidden";
                if (workbookData) renderRepairs(workbookData.Sheets[workbookData.SheetNames[1]]);
            }
        }

        document.addEventListener("DOMContentLoaded", initExcelEngine);
    </script>
</body>
</html>
